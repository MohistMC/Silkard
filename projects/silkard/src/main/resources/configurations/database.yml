# Silkard Database Configuration
# Each feature can independently choose its database backend: "sqlite" (default) or "mysql"
# SQLite data is stored in silkard-config/database/silkard.db
# MySQL data uses the shared connection configured below

database:
  # Default database type for all features (sqlite | mysql)
  default: sqlite

  # MySQL connection settings (used when features.<name> is set to "mysql")
  mysql:
    jdbc-url: "jdbc:mysql://127.0.0.1:3306/minecraft?useSSL=false&allowPublicKeyRetrieval=true"
    username: "root"
    password: ""
    table-prefix: "silkard"

  # Feature-specific database backend selection
  features:
    items: sqlite
    entity_limits: sqlite
    warps: sqlite
    bans:
      item: sqlite
      item_moshou: sqlite
      entity: sqlite
      enchantment: sqlite
      recipe: sqlite
      block: sqlite
      world: sqlite
      nbt: sqlite
